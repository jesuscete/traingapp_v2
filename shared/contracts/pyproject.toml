[project]
name = "traingapp-contracts"
version = "0.1.0"
description = "Shared OpenAPI/JSON Schema contracts of TraingApp v2"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false
